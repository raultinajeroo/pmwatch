# Matched-pair configuration for pmwatch.
#
# Each entry links two markets on different venues that resolve on the same
# underlying event. Matching is manual: you must verify that resolution
# sources, deadlines, and settlement rules actually agree before treating a
# pair as comparable.
#
# How to find the ids:
#   Polymarket: every binary market has two CLOB token ids (YES and NO).
#     Query the Gamma API, e.g.
#       curl 'https://gamma-api.polymarket.com/markets?slug=<market-slug>'
#     and read the `clobTokenIds` field (a JSON-encoded list; the first entry
#     is the YES token). Use the YES token id below.
#     Docs: https://docs.polymarket.com
#   Kalshi: the market ticker, visible in the market URL and via
#       curl 'https://api.elections.kalshi.com/trade-api/v2/markets?limit=100'
#     e.g. KXFEDCUT-26SEP.
#
# Fees: each leg picks a model with `fee_model_a` / `fee_model_b`. These are
# configuration, not venue truth — venue schedules change.
#
#   flat_bps (default)  fee = price * fee_bps / 10_000. Linear. Correct for a
#                       flat proportional taker fee, and correct at 0 bps for
#                       Polymarket, which charges no taker fee on most markets.
#   kalshi              fee = 0.07 * price * (1 - price) per contract, Kalshi's
#                       published schedule. Quadratic: it peaks at 1.75c near a
#                       price of 0.50 and falls to ~0 at the extremes.
#
# Use the model the venue actually charges. A flat-bps stand-in on a Kalshi leg
# understates the true fee by roughly 7.5x mid-book (0.23c against 1.74c at a
# price of 0.455), which is enough to manufacture arbs that do not exist.

pairs:
  - name: fed-cut-sep-2026
    question: "Fed rate cut at the September 2026 FOMC meeting?"
    venue_a_id: "polymarket:71421073552824748158727123880192916231126298749016433804985512678244506118802"
    venue_b_id: "kalshi:KXFEDCUT-26SEP"
    fee_model_a: flat_bps   # Polymarket: no taker fee on most markets
    fee_bps_a: 0
    fee_model_b: kalshi     # Kalshi: its published 0.07 * P * (1-P) schedule

  - name: us-recession-2026
    question: "US recession officially declared in 2026?"
    venue_a_id: "polymarket:10991116138533105882592986411493613034453350373791148161637446953207610462207"
    venue_b_id: "kalshi:KXRECESSION-26"
    fee_model_a: flat_bps
    fee_bps_a: 0
    fee_model_b: kalshi
