[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pmwatch"
version = "0.1.0"
description = "Cross-venue prediction-market microstructure monitor (read-only, research use)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Raul Tinajero Olivas" }]
keywords = ["prediction-markets", "microstructure", "polymarket", "kalshi", "research"]
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]
live = ["cryptography>=42"]  # Kalshi RSA-PSS request signing (live mode only)

[project.scripts]
pmwatch = "pmwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
